name: CircuitForge checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: circuit-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: circuit-forge/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: npm run test:export -- --required
      - run: npx playwright install --with-deps chromium
      - run: npm run evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuitforge-evidence
          path: |
            circuit-forge/results
            circuit-forge/docs/images
            circuit-forge/test-results
          retention-days: 7
